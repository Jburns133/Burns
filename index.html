<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alien Abduction: Fullscreen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050510">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #050510;
    overflow: hidden; /* Prevents scrolling */
    touch-action: none; /* Stops pull-to-refresh */
  }
  canvas {
    display: block;
    position: fixed; /* Locks it to the screen */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// --- GAME VARIABLES ---
let ufoX = window.innerWidth / 2;
let targetX = window.innerWidth / 2;
let ufoTilt = 0;
let beamOn = false;
let score = 0;
let highScore = localStorage.getItem('alienHighScore') || 0;
let energy = 100;
let frame = 0;

const humans = [];
const particles = [];
const stars = [];

// --- ROBUST RESIZING ---
// This function ensures the internal resolution matches the screen size exactly
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initStars(); // Re-scatter stars if screen changes
}
// Listen for orientation changes (turning phone sideways)
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 100)); // Delay slightly for screen rotation
resize();

// --- INPUTS ---
const updatePos = (x) => targetX = x;

// Touch & Mouse Logic
window.addEventListener("mousemove", e => updatePos(e.clientX));
window.addEventListener("touchmove", e => { 
  updatePos(e.touches[0].clientX); 
  e.preventDefault(); // Stop screen from dragging
}, {passive:false});

const startBeam = (e) => {
  if(e.cancelable) e.preventDefault(); // Stop double-tap zoom
  beamOn = true;
};
const endBeam = (e) => {
  beamOn = false;
};

window.addEventListener("mousedown", startBeam);
window.addEventListener("mouseup", endBeam);
window.addEventListener("touchstart", startBeam, {passive: false});
window.addEventListener("touchend", endBeam);

// --- STARS SYSTEM ---
function initStars(){
  stars.length = 0;
  // Create more stars for bigger screens
  const count = Math.floor(canvas.width * canvas.height / 4000); 
  for(let i=0; i<count; i++){
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2,
      speed: Math.random() * 0.5 + 0.1
    });
  }
}

function drawStars(){
  ctx.fillStyle = "white";
  stars.forEach(s => {
    s.y += s.speed;
    if(s.y > canvas.height) s.y = 0;
    ctx.globalAlpha = Math.random() * 0.5 + 0.3;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
  ctx.globalAlpha = 1.0;
}

// --- PARTICLES ---
function spawnParticles(x, y, color){
  for(let i=0; i<15; i++){
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      life: 1.0,
      color: color
    });
  }
}

function drawParticles(){
  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
    if(p.life <= 0) particles.splice(i, 1);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fillRect(p.x, p.y, 4, 4);
  });
  ctx.globalAlpha = 1.0;
}

// --- HUMANS ---
const skins = [
  { name: "WORKER", skin: "#ffccaa", shirt: "#ff6600", pants: "#0000dd", hat: "#ffff00" },
  { name: "PUNK",   skin: "#ffccaa", shirt: "#111111", pants: "#333333", hat: "#ff0055" },
  { name: "SUIT",   skin: "#8d5524", shirt: "#440088", pants: "#220044", hat: "#220044" },
  { name: "BEACH",  skin: "#ffccaa", shirt: "#ff00aa", pants: "#00ffcc", hat: "" }
];

function spawnHuman(){
  if(humans.length < 8) {
    humans.push({
      x: Math.random() * canvas.width,
      y: canvas.height - 50,
      type: skins[Math.floor(Math.random() * skins.length)],
      vx: (Math.random() - 0.5) * 3,
      lift: 0,
      legAnim: 0
    });
  }
}
setInterval(spawnHuman, 800);

function drawBlockyHuman(h){
  const x = h.x;
  const y = h.y - h.lift;
  const s = h.type;
  h.legAnim += 0.5;
  const legOffset = h.lift > 0 ? 0 : Math.sin(h.legAnim) * 3;

  ctx.save();
  if(h.lift > 0) ctx.translate(Math.random()*2 - 1, 0);

  // Shadow
  if(h.lift < 10){
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(x, canvas.height-38, 8, 3, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // Draw Body Parts
  ctx.fillStyle = s.pants;
  ctx.fillRect(x - 6, y + legOffset, 5, 12);
  ctx.fillRect(x + 1, y - legOffset, 5, 12);
  ctx.fillStyle = s.shirt;
  ctx.fillRect(x - 7, y - 12, 14, 12);
  ctx.fillStyle = s.skin;
  ctx.fillRect(x - 5, y - 20, 10, 8);

  // Hats
  if(s.name === "WORKER"){
    ctx.fillStyle = s.hat;
    ctx.fillRect(x - 6, y - 23, 12, 4);
  } else if (s.name === "PUNK") {
    ctx.fillStyle = s.hat;
    ctx.fillRect(x - 2, y - 26, 4, 6);
  } else if (s.name === "SUIT") {
    ctx.fillStyle = s.hat;
    ctx.fillRect(x - 7, y - 22, 14, 3);
    ctx.fillRect(x - 5, y - 25, 10, 4);
  }

  // Arms
  ctx.fillStyle = s.skin;
  if(h.lift > 0) {
    ctx.fillRect(x - 12, y - 24 + Math.sin(h.legAnim*2)*4, 4, 10);
    ctx.fillRect(x + 8, y - 24 + Math.cos(h.legAnim*2)*4, 4, 10);
  } else {
    ctx.fillRect(x - 11, y - 12, 4, 10);
    ctx.fillRect(x + 7, y - 12, 4, 10);
  }
  ctx.restore();
}

// --- UFO ---
function drawUFO(){
  let diff = targetX - ufoX;
  ufoX += diff * 0.1;
  ufoTilt = Math.max(-0.4, Math.min(0.4, diff * 0.05));

  const y = 110;

  ctx.save();
  ctx.translate(ufoX, y);
  ctx.rotate(ufoTilt);

  // Dome & Alien
  ctx.fillStyle = "rgba(0, 200, 255, 0.4)";
  ctx.beginPath();
  ctx.arc(0, -10, 35, Math.PI, 0);
  ctx.fill();

  ctx.fillStyle = "#33cc33";
  ctx.beginPath();
  ctx.ellipse(0, -15, 12, 16, 0, 0, Math.PI*2);
  ctx.fill();
  
  if(frame % 150 < 140) {
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.ellipse(-5, -15, 4, 6, -0.2, 0, Math.PI*2);
    ctx.ellipse(5, -15, 4, 6, 0.2, 0, Math.PI*2);
    ctx.fill();
  }

  // Reflection
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(10, -25, 8, 1.5*Math.PI, 0);
  ctx.stroke();

  // Saucer
  ctx.fillStyle = "#ccc";
  ctx.beginPath();
  ctx.ellipse(0, 0, 60, 18, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#ff9900";
  ctx.beginPath();
  ctx.ellipse(0, 5, 60, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // Lights
  const time = Date.now() / 150;
  for(let i=0; i<5; i++){
    ctx.fillStyle = `hsl(${(time * 100 + i*60) % 360}, 100%, 60%)`;
    let lx = -40 + i * 20;
    ctx.beginPath();
    ctx.arc(lx, 8, 4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBeam(){
  if(!beamOn || energy <= 0) return;
  energy -= 0.4;
  
  ctx.save();
  ctx.translate(ufoX, 120);
  ctx.rotate(ufoTilt * 0.5);

  const grd = ctx.createLinearGradient(0, 0, 0, canvas.height-120);
  grd.addColorStop(0, "rgba(0, 255, 220, 0.6)");
  grd.addColorStop(1, "rgba(0, 255, 220, 0)");
  
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(-20, 0);
  ctx.lineTo(20, 0);
  ctx.lineTo(70, canvas.height); // Beam stretches to infinite bottom
  ctx.lineTo(-70, canvas.height);
  ctx.fill();
  ctx.restore();
}

// --- LOOP ---
function loop(){
  frame++;
  // Background
  const bgGrad = ctx.createLinearGradient(0,0,0,canvas.height);
  bgGrad.addColorStop(0, "#050510");
  bgGrad.addColorStop(1, "#202040");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,canvas.width, canvas.height);

  drawStars();

  // Floor
  ctx.fillStyle = "#111";
  ctx.fillRect(0, canvas.height-40, canvas.width, 40);
  ctx.fillStyle = "#222";
  ctx.fillRect(0, canvas.height-35, canvas.width, 2);

  drawBeam();
  drawParticles();

  // Game Logic
  humans.forEach((h, index) => {
    let dist = Math.abs(h.x - ufoX);
    if(beamOn && dist < 50 && energy > 0){
      h.lift += 6;
      if(h.lift > canvas.height - 150) {
        spawnParticles(ufoX, 130, h.type.shirt);
        humans.splice(index, 1);
        score++;
        if(score > highScore) {
           highScore = score;
           localStorage.setItem('alienHighScore', highScore);
        }
        energy = Math.min(100, energy + 12);
      }
    } else {
      if(h.lift > 0) h.lift -= 8;
      else {
        h.x += h.vx;
        if(h.x < 0 || h.x > canvas.width) h.vx *= -1;
      }
    }
    drawBlockyHuman(h);
  });

  drawUFO();

  // UI
  ctx.fillStyle = "white";
  ctx.font = "bold 20px Courier New";
  ctx.fillText("SCORE: " + score, 20, 40);
  ctx.font = "14px Courier New";
  ctx.fillStyle = "#aaa";
  ctx.fillText("BEST: " + highScore, 20, 60);
  
  ctx.fillStyle = "#444";
  ctx.fillRect(20, 75, 100, 8);
  ctx.fillStyle = energy > 20 ? "#00ffcc" : "#ff0055";
  ctx.fillRect(20, 75, energy, 8);

  if(!beamOn) energy = Math.min(100, energy + 0.25);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
