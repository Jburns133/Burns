<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kart Abduction</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body { margin:0; background:#222; overflow:hidden; font-family: 'Courier New', monospace; touch-action: none; }
  canvas { display:block; background: linear-gradient(#000, #113); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let ufoX = innerWidth / 2;
let targetX = innerWidth / 2;
let beamOn = false;
let score = 0;
let energy = 100;
const karts = [];

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

// INPUTS
const updatePos = (x) => targetX = x;
window.addEventListener("mousemove", e => updatePos(e.clientX));
window.addEventListener("touchmove", e => { updatePos(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
window.addEventListener("mousedown", () => beamOn = true);
window.addEventListener("mouseup", () => beamOn = false);
window.addEventListener("touchstart", () => beamOn = true);
window.addEventListener("touchend", () => beamOn = false);

function spawnKart(){
  if(karts.length < 6) {
    karts.push({
      x: Math.random() * canvas.width,
      y: canvas.height - 60,
      color: `hsl(${Math.random() * 360}, 70%, 50%)`,
      vx: (Math.random() - 0.5) * 4,
      bounce: 0
    });
  }
}
setInterval(spawnKart, 1200);

function drawPixelKart(x, y, color, bounce) {
  ctx.save();
  ctx.translate(x, y + Math.sin(bounce) * 3);
  
  // Kart Body
  ctx.fillStyle = color;
  ctx.fillRect(-15, 0, 30, 10); 
  ctx.fillRect(-10, -8, 20, 8);
  
  // Wheels
  ctx.fillStyle = "#000";
  ctx.fillRect(-14, 8, 8, 8);
  ctx.fillRect(6, 8, 8, 8);
  
  // Driver Head (Mario-ish Cap)
  ctx.fillStyle = "#FFD700"; // Skin
  ctx.fillRect(-4, -14, 8, 8);
  ctx.fillStyle = "#F00"; // Red Cap
  ctx.fillRect(-6, -16, 12, 4);
  
  ctx.restore();
}

function drawUFO(){
  ufoX += (targetX - ufoX) * 0.2;
  // Lakitu Cloud / Saucer
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(ufoX, 90, 30, 0, Math.PI * 2);
  ctx.arc(ufoX - 25, 95, 20, 0, Math.PI * 2);
  ctx.arc(ufoX + 25, 95, 20, 0, Math.PI * 2);
  ctx.fill();
  
  // Eyes
  ctx.fillStyle = "black";
  ctx.fillRect(ufoX - 10, 85, 4, 8);
  ctx.fillRect(ufoX + 6, 85, 4, 8);
}

function loop(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Road
  ctx.fillStyle = "#444";
  ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
  ctx.fillStyle = "#666";
  ctx.fillRect(0, canvas.height - 55, canvas.width, 2);

  // Beam
  if(beamOn && energy > 0) {
    energy -= 0.5;
    ctx.fillStyle = "rgba(255, 255, 0, 0.3)";
    ctx.beginPath();
    ctx.moveTo(ufoX - 30, 110);
    ctx.lineTo(ufoX + 30, 110);
    ctx.lineTo(ufoX + 80, canvas.height);
    ctx.lineTo(ufoX - 80, canvas.height);
    ctx.fill();
  }

  // Update Karts
  karts.forEach((k, i) => {
    k.bounce += 0.2;
    let inBeam = beamOn && Math.abs(k.x - ufoX) < 50;
    
    if(inBeam && energy > 0) {
      k.y -= 5;
      if(k.y < 110) {
        karts.splice(i, 1);
        score++;
        energy = Math.min(100, energy + 20);
      }
    } else {
      if(k.y < canvas.height - 60) k.y += 6; // Fall
      k.x += k.vx;
      if(k.x < 0 || k.x > canvas.width) k.vx *= -1;
    }
    drawPixelKart(k.x, k.y, k.color, k.bounce);
  });

  drawUFO();
  
  // UI
  ctx.fillStyle = "#FFD700";
  ctx.font = "bold 20px Courier New";
  ctx.fillText("COINS: " + score, 20, 40);
  ctx.fillStyle = "#444";
  ctx.fillRect(20, 50, 100, 10);
  ctx.fillStyle = "#FFD700";
  ctx.fillRect(20, 50, energy, 10);

  if(!beamOn) energy = Math.min(100, energy + 0.2);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
