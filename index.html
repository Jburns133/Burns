<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alien Abduction: Blocky Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body { margin:0; background:#111; overflow:hidden; font-family: 'Courier New', sans-serif; touch-action: none; }
  canvas { display:block; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// GAME STATE
let ufoX = innerWidth / 2;
let targetX = innerWidth / 2;
let beamOn = false;
let score = 0;
let energy = 100;
const humans = [];

// RESIZE
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

// INPUTS (Mouse & Touch)
const updatePos = (x) => targetX = x;
window.addEventListener("mousemove", e => updatePos(e.clientX));
window.addEventListener("touchmove", e => { 
  updatePos(e.touches[0].clientX); 
  e.preventDefault(); 
}, {passive:false});

const startBeam = () => beamOn = true;
const endBeam = () => beamOn = false;
window.addEventListener("mousedown", startBeam);
window.addEventListener("mouseup", endBeam);
window.addEventListener("touchstart", startBeam);
window.addEventListener("touchend", endBeam);

// --- CHARACTERS (Blocky Style) ---
// We define different "skins" to match your image
const skins = [
  { name: "WORKER", skin: "#ffccaa", shirt: "#ff6600", pants: "#0000dd", hat: "#ffff00" }, // Construction
  { name: "PUNK",   skin: "#ffccaa", shirt: "#111111", pants: "#333333", hat: "#ff0055" }, // Mohawk
  { name: "SUIT",   skin: "#8d5524", shirt: "#440088", pants: "#220044", hat: "#220044" }, // Purple Suit
  { name: "BEACH",  skin: "#ffccaa", shirt: "#ff00aa", pants: "#00ffcc", hat: "" }         // Beach
];

function spawnHuman(){
  if(humans.length < 8) {
    humans.push({
      x: Math.random() * canvas.width,
      y: canvas.height - 50,
      type: skins[Math.floor(Math.random() * skins.length)],
      vx: (Math.random() - 0.5) * 2.5,
      lift: 0,
      wobble: Math.random() * 10
    });
  }
}
setInterval(spawnHuman, 1000);

// DRAWING FUNCTIONS

function drawBlockyHuman(h){
  const x = h.x;
  const y = h.y - h.lift;
  const s = h.type; // Skin data
  
  ctx.save();
  // Wiggle if being lifted
  if(h.lift > 0) ctx.translate(Math.sin(h.wobble)*3, 0);

  // 1. LEGS (Blocky)
  ctx.fillStyle = s.pants;
  // Left leg
  ctx.fillRect(x - 6, y, 5, 12);
  // Right leg
  ctx.fillRect(x + 1, y, 5, 12);

  // 2. BODY (Blocky)
  ctx.fillStyle = s.shirt;
  ctx.fillRect(x - 7, y - 12, 14, 12);
  
  // 3. HEAD (Square)
  ctx.fillStyle = s.skin;
  ctx.fillRect(x - 5, y - 20, 10, 8);

  // 4. HAT / HAIR
  if(s.name === "WORKER"){
    ctx.fillStyle = s.hat; // Hard hat
    ctx.fillRect(x - 6, y - 23, 12, 4);
  } else if (s.name === "PUNK") {
    ctx.fillStyle = s.hat; // Mohawk
    ctx.fillRect(x - 2, y - 26, 4, 6);
  } else if (s.name === "SUIT") {
    ctx.fillStyle = s.hat; // Fedora
    ctx.fillRect(x - 7, y - 22, 14, 3); // Brim
    ctx.fillRect(x - 5, y - 25, 10, 4); // Top
  }

  // 5. ARMS
  ctx.fillStyle = s.skin;
  if(h.lift > 0) {
    // Arms up if panicked!
    ctx.fillRect(x - 11, y - 22, 4, 10);
    ctx.fillRect(x + 7, y - 22, 4, 10);
  } else {
    // Arms down
    ctx.fillRect(x - 11, y - 12, 4, 10);
    ctx.fillRect(x + 7, y - 12, 4, 10);
  }

  ctx.restore();
}

function drawUFO(){
  // Smooth movement
  ufoX += (targetX - ufoX) * 0.15;
  const y = 100;
  
  // 1. DOME (Back)
  ctx.fillStyle = "rgba(0, 200, 255, 0.3)";
  ctx.beginPath();
  ctx.arc(ufoX, y-10, 35, Math.PI, 0);
  ctx.fill();

  // 2. ALIEN (Green head inside)
  ctx.fillStyle = "#33cc33"; // Alien Green
  ctx.beginPath();
  ctx.ellipse(ufoX, y-15, 12, 16, 0, 0, Math.PI*2); // Head
  ctx.fill();
  
  // Alien Eyes
  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.ellipse(ufoX - 5, y-15, 4, 6, -0.2, 0, Math.PI*2);
  ctx.ellipse(ufoX + 5, y-15, 4, 6, 0.2, 0, Math.PI*2);
  ctx.fill();

  // 3. DOME (Glass reflection front)
  ctx.strokeStyle = "rgba(255,255,255,0.6)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(ufoX+10, y-25, 8, 1.5*Math.PI, 0);
  ctx.stroke();

  // 4. SAUCER BODY (Gray)
  ctx.fillStyle = "#dddddd";
  ctx.beginPath();
  ctx.ellipse(ufoX, y, 60, 18, 0, 0, Math.PI*2);
  ctx.fill();
  
  // 5. RIM (Orange)
  ctx.fillStyle = "#ff8800";
  ctx.beginPath();
  ctx.ellipse(ufoX, y+5, 60, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // 6. CHANGING LIGHTS
  const time = Date.now() / 200;
  for(let i=0; i<5; i++){
    // Cycle colors
    ctx.fillStyle = `hsl(${(time * 100 + i*60) % 360}, 100%, 50%)`;
    let lx = ufoX - 40 + i * 20;
    let ly = y + 8; // On the rim
    ctx.beginPath();
    ctx.arc(lx, ly, 4, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawBeam(){
  if(!beamOn || energy <= 0) return;
  energy -= 0.4;
  
  // Cool Gradient Beam
  const grd = ctx.createLinearGradient(0, 110, 0, canvas.height);
  grd.addColorStop(0, "rgba(0, 255, 200, 0.5)");
  grd.addColorStop(1, "rgba(0, 255, 200, 0)");
  
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(ufoX - 20, 120); // Top left
  ctx.lineTo(ufoX + 20, 120); // Top right
  ctx.lineTo(ufoX + 60, canvas.height); // Bottom right
  ctx.lineTo(ufoX - 60, canvas.height); // Bottom left
  ctx.fill();
}

function updateGame(){
  // Clear Screen
  ctx.fillStyle = "#111"; // Dark background
  ctx.fillRect(0,0,canvas.width, canvas.height);

  // City Floor
  ctx.fillStyle = "#222";
  ctx.fillRect(0, canvas.height-40, canvas.width, 40);

  drawBeam();

  // Update Humans
  humans.forEach((h, index) => {
    // Check if in beam
    let dist = Math.abs(h.x - ufoX);
    if(beamOn && dist < 50 && energy > 0){
      h.lift += 4;
      h.wobble += 0.5;
      // Caught!
      if(h.lift > canvas.height - 130) {
        humans.splice(index, 1);
        score++;
        energy = Math.min(100, energy + 15);
      }
    } else {
      // Gravity
      if(h.lift > 0) h.lift -= 5;
      else {
        h.x += h.vx;
        if(h.x < 0 || h.x > canvas.width) h.vx *= -1;
      }
    }
    drawBlockyHuman(h);
  });

  drawUFO();

  // UI
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 20, 40);
  
  // Energy Bar
  ctx.fillStyle = "gray";
  ctx.fillRect(20, 50, 100, 10);
  ctx.fillStyle = energy > 20 ? "#00ff00" : "red";
  ctx.fillRect(20, 50, energy, 10);

  if(!beamOn) energy = Math.min(100, energy + 0.2);

  requestAnimationFrame(updateGame);
}

// START
updateGame();

</script>
</body>
</html>
