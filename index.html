<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stoned Alien Abduction</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<style>
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #050510; overflow: hidden; touch-action: none; font-family: 'Courier New', monospace; }
  canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  #menu {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5, 5, 16, 0.9); z-index: 10; color: #0f0; text-align: center;
  }
  h1 { font-size: 3rem; text-shadow: 0 0 20px #0f0; margin-bottom: 10px; }
  .btn {
    padding: 15px 40px; font-size: 1.5rem; background: #0f0; color: #000;
    border: none; border-radius: 50px; cursor: pointer; font-weight: bold;
    box-shadow: 0 0 15px #0f0; transition: 0.3s;
  }
  .btn:active { transform: scale(0.9); box-shadow: 0 0 5px #0f0; }
</style>
</head>
<body>

<div id="menu">
  <canvas id="alienFace" width="200" height="200"></canvas>
  <h1>STONED ALIENS</h1>
  <p style="color: #888;">THEY'RE HUNGRY FOR BLOCKHEADS</p>
  <button class="btn" onclick="startGame()">START GAME</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const menu = document.getElementById("menu");
const faceCanvas = document.getElementById("alienFace");
const fctx = faceCanvas.getContext("2d");

let gameRunning = false;
let ufoX = window.innerWidth / 2, targetX = window.innerWidth / 2, ufoTilt = 0;
let beamOn = false, score = 0, energy = 100, frame = 0;
const humans = [], particles = [], stars = [];

// --- AUDIO SYNTHESIZER ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, vol) {
  if (!gameRunning) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// --- DRAW STONED ALIEN FACE ---
function drawStonedAlien() {
  fctx.clearRect(0,0,200,200);
  fctx.fillStyle = "#33cc33";
  fctx.beginPath(); // Head
  fctx.ellipse(100, 100, 60, 80, 0, 0, Math.PI*2);
  fctx.fill();
  // Droopy Eyes
  fctx.fillStyle = "#fff";
  fctx.beginPath();
  fctx.ellipse(75, 80, 20, 15, 0.2, 0, Math.PI*2);
  fctx.ellipse(125, 80, 20, 15, -0.2, 0, Math.PI*2);
  fctx.fill();
  // Red veins (stoned)
  fctx.strokeStyle = "rgba(255,0,0,0.5)";
  fctx.lineWidth = 1;
  fctx.beginPath(); fctx.moveTo(65, 80); fctx.lineTo(85, 85); fctx.stroke();
  // Pupils (lowered)
  fctx.fillStyle = "#000";
  fctx.beginPath();
  fctx.arc(75, 85, 8, 0, Math.PI*2);
  fctx.arc(125, 85, 8, 0, Math.PI*2);
  fctx.fill();
  // Smile
  fctx.strokeStyle = "#000";
  fctx.lineWidth = 3;
  fctx.beginPath(); fctx.arc(100, 130, 20, 0.2, Math.PI-0.2); fctx.stroke();
}
drawStonedAlien();

function startGame() {
  audioCtx.resume();
  menu.style.display = "none";
  gameRunning = true;
  score = 0;
  energy = 100;
  resize();
}

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars.length = 0;
  for(let i=0; i<100; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2, sp: Math.random()*0.5+0.1});
}
window.addEventListener("resize", resize);
resize();

// --- INPUTS ---
const move = (x) => targetX = x;
window.addEventListener("mousemove", e => move(e.clientX));
window.addEventListener("touchmove", e => { move(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
window.addEventListener("mousedown", () => { beamOn = true; playSound(400, 'sawtooth', 0.5, 0.1); });
window.addEventListener("mouseup", () => beamOn = false);
window.addEventListener("touchstart", (e) => { beamOn = true; playSound(400, 'sawtooth', 0.5, 0.1); e.preventDefault(); }, {passive:false});
window.addEventListener("touchend", () => beamOn = false);

// --- HUMAN SKINS ---
const skins = [
  { n: "WORKER", s: "#ffccaa", sh: "#ff6600", p: "#0000dd", h: "#ffff00" },
  { n: "PUNK",   s: "#ffccaa", sh: "#111111", p: "#333333", h: "#ff0055" },
  { n: "SUIT",   s: "#8d5524", sh: "#440088", p: "#220044", h: "#220044" }
];

function spawnHuman(){
  if(humans.length < 8 && gameRunning) {
    humans.push({ x: Math.random()*canvas.width, y: canvas.height-50, t: skins[Math.floor(Math.random()*skins.length)], vx: (Math.random()-0.5)*3, lift: 0 });
  }
}
setInterval(spawnHuman, 800);

function loop(){
  frame++;
  ctx.fillStyle = "#050510";
  ctx.fillRect(0,0,canvas.width, canvas.height);
  
  stars.forEach(s => {
    s.y += s.sp; if(s.y > canvas.height) s.y = 0;
    ctx.fillStyle = "white"; ctx.fillRect(s.x, s.y, s.s, s.s);
  });

  if(!gameRunning) { requestAnimationFrame(loop); return; }

  // Draw Floor
  ctx.fillStyle = "#111"; ctx.fillRect(0, canvas.height-40, canvas.width, 40);

  // Beam
  if(beamOn && energy > 0) {
    energy -= 0.5;
    const grd = ctx.createLinearGradient(ufoX, 120, ufoX, canvas.height);
    grd.addColorStop(0, "rgba(0, 255, 100, 0.5)"); grd.addColorStop(1, "transparent");
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.moveTo(ufoX-20, 120); ctx.lineTo(ufoX+20, 120); ctx.lineTo(ufoX+60, canvas.height); ctx.lineTo(ufoX-60, canvas.height); ctx.fill();
  }

  // UFO
  ufoX += (targetX - ufoX) * 0.1;
  ctx.save(); ctx.translate(ufoX, 110);
  ctx.fillStyle = "rgba(0,255,255,0.3)"; ctx.beginPath(); ctx.arc(0,-10,35,Math.PI,0); ctx.fill(); // Dome
  ctx.fillStyle = "#33cc33"; ctx.beginPath(); ctx.ellipse(0,-15,10,14,0,0,Math.PI*2); ctx.fill(); // Alien
  ctx.fillStyle = "#ccc"; ctx.beginPath(); ctx.ellipse(0,0,60,18,0,0,Math.PI*2); ctx.fill(); // Saucer
  ctx.restore();

  // Humans
  humans.forEach((h, i) => {
    if(beamOn && Math.abs(h.x-ufoX) < 50) {
      h.lift += 6;
      if(h.lift > canvas.height-160) {
        humans.splice(i,1); score++; energy = Math.min(100, energy+15);
        playSound(800, 'sine', 0.2, 0.2); // Abduction sound
      }
    } else { if(h.lift > 0) h.lift -= 8; else h.x += h.vx; if(h.x<0||h.x>canvas.width) h.vx*=-1; }
    
    // Draw blocky man
    ctx.fillStyle = h.t.sh; ctx.fillRect(h.x-7, canvas.height-h.lift-62, 14, 12);
    ctx.fillStyle = h.t.s; ctx.fillRect(h.x-5, canvas.height-h.lift-70, 10, 8);
  });

  // UI
  ctx.fillStyle = "#0f0"; ctx.font = "bold 20px Courier"; ctx.fillText("SCORE: "+score, 20, 40);
  ctx.fillStyle = "#333"; ctx.fillRect(20, 50, 100, 10);
  ctx.fillStyle = "#0f0"; ctx.fillRect(20, 50, energy, 10);
  if(!beamOn) energy = Math.min(100, energy+0.2);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
